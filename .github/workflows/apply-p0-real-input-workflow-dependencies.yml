name: Apply P0 Real Input Workflow Dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-workflow-dependencies:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/p0-real-input-audio-2026-07-25

      - name: Add the real-input module to every sparse checkout that runs P0
        shell: python
        run: |
          from pathlib import Path

          workflows = sorted(Path('.github/workflows').glob('*.y*ml'))
          changed = []
          for path in workflows:
              text = path.read_text(encoding='utf-8-sig')
              if 'tools/cinema_p0_autopilot.py' not in text:
                  continue
              if 'tools/cinema_real_input_audio.py' in text:
                  continue
              lines = text.splitlines()
              output = []
              inserted = False
              for line in lines:
                  output.append(line)
                  if line.strip() == 'tools/cinema_p0_autopilot.py':
                      indentation = line[: len(line) - len(line.lstrip())]
                      output.append(indentation + 'tools/cinema_real_input_audio.py')
                      inserted = True
              if not inserted:
                  raise SystemExit(f'Could not patch sparse checkout in {path}')
              path.write_text('\n'.join(output) + '\n', encoding='utf-8', newline='\n')
              changed.append(str(path))

          if not changed:
              print('All P0 workflows already include tools/cinema_real_input_audio.py')
          else:
              print('Patched workflow dependencies:')
              for path in changed:
                  print(path)

          for path in workflows:
              text = path.read_text(encoding='utf-8-sig')
              if 'tools/cinema_p0_autopilot.py' in text and 'tools/cinema_real_input_audio.py' not in text:
                  raise SystemExit(f'Missing real-input dependency after repair: {path}')

      - name: Commit workflow dependency repairs
        shell: bash
        run: |
          git config user.name 'Echoes Cinema Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'No workflow dependency repair required.'
            exit 0
          fi
          git commit -m 'Include real input audio in P0 workflow checkouts'
          git push origin HEAD:feature/p0-real-input-audio-2026-07-25
