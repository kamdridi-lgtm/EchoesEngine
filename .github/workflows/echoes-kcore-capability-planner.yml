name: Echoes K-Core Capability Planner

on:
  pull_request:
    paths:
      - "config/echoes-capability-registry.v1.json"
      - "config/song-activity-timeline.v1.json"
      - "config/echoes-stem-runtime.v1.json"
      - "tools/kcore_mission_planner.py"
      - "tools/validate_kcore_song_activity_timeline.py"
      - "tools/validate_kcore_stem_integration.py"
      - ".github/workflows/echoes-kcore-capability-planner.yml"
  push:
    branches:
      - main
    paths:
      - "config/echoes-capability-registry.v1.json"
      - "config/song-activity-timeline.v1.json"
      - "config/echoes-stem-runtime.v1.json"
      - "tools/kcore_mission_planner.py"
      - "tools/validate_kcore_song_activity_timeline.py"
      - "tools/validate_kcore_stem_integration.py"
      - ".github/workflows/echoes-kcore-capability-planner.yml"

permissions:
  contents: read

jobs:
  capability-planner:
    name: Capability planner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout planner sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config/echoes-capability-registry.v1.json
            config/song-activity-timeline.v1.json
            config/echoes-stem-runtime.v1.json
            tools/kcore_mission_planner.py
            tools/validate_kcore_song_activity_timeline.py
            tools/validate_kcore_stem_integration.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and execute planner contract
        run: |
          python -m py_compile tools/kcore_mission_planner.py tools/validate_kcore_song_activity_timeline.py tools/validate_kcore_stem_integration.py
          python tools/kcore_mission_planner.py --self-test

      - name: Prove global song activity timeline integration
        run: >-
          python tools/validate_kcore_song_activity_timeline.py
          --registry config/echoes-capability-registry.v1.json
          --manifest config/song-activity-timeline.v1.json
          --output artifacts/kcore-song-activity-integration.json

      - name: Prove global stem separation integration
        run: >-
          python tools/validate_kcore_stem_integration.py
          --registry config/echoes-capability-registry.v1.json
          --manifest config/echoes-stem-runtime.v1.json
          --output artifacts/kcore-stem-integration.json

      - name: Verify fail-closed planning and power targets
        shell: pwsh
        run: |
          $planner = Get-Content -LiteralPath "tools/kcore_mission_planner.py" -Raw
          $registry = Get-Content -LiteralPath "config/echoes-capability-registry.v1.json" -Raw | ConvertFrom-Json
          $timelineIntegration = Get-Content -LiteralPath "artifacts/kcore-song-activity-integration.json" -Raw | ConvertFrom-Json
          $stemIntegration = Get-Content -LiteralPath "artifacts/kcore-stem-integration.json" -Raw | ConvertFrom-Json
          foreach ($token in @(
            'kcore.execution-plan.v1',
            'mutationsAllowed',
            'requiresOperatorApproval',
            'COMMERCIAL_USE_NOT_APPROVED',
            'PROVIDER_STATUS_NOT_PASS',
            'QUALITY_',
            'MISSING_PROVIDER_CAPABILITIES',
            'UNPROVEN_ENGINE_MODULES',
            'cinema_identity_local_v1',
            'cinema_hybrid_identity_v1'
          )) {
            if (-not $planner.Contains($token)) { throw "Planner contract token missing: $token" }
          }
          foreach ($module in @(
            'masteringChain',
            'spatialQSound',
            'fatigueSimulation',
            'microPitchDrift',
            'naturalnessScoring',
            'monoSafety',
            'onnxModelManager',
            'sileroVadProduction',
            'songActivityTimeline',
            'htdemucsStemSeparation',
            'neuralScheduler',
            'multiStateRenderer',
            'psychoacousticEngine',
            'stemExports'
          )) {
            if (-not $registry.engineModules.PSObject.Properties.Name.Contains($module)) {
              throw "Echoes power target missing from registry: $module"
            }
          }
          if ($registry.version -ne '1.5.0') { throw 'Capability registry version drifted' }
          if ($registry.integrationRevision -ne '2026-07-27-kcore-stems') { throw 'Stem integration revision drifted' }
          if ($timelineIntegration.status -ne 'PASS') { throw 'K-Core song activity integration proof did not pass' }
          if ($timelineIntegration.missingModulePlanStatus -ne 'BLOCKED') { throw 'Missing timeline module did not block planning' }
          if ($timelineIntegration.instrumentalClassificationProven -ne $false -or
              $timelineIntegration.vocalIsolationProven -ne $false -or
              $timelineIntegration.stemSeparationProven -ne $false -or
              $timelineIntegration.executionAuthorized -ne $false) {
            throw 'Song activity truth boundary drifted'
          }
          if ($stemIntegration.status -ne 'PASS') { throw 'K-Core stem integration proof did not pass' }
          if ($stemIntegration.selectedPipeline -ne 'stem_separation_windows_v1') { throw 'Stem pipeline selection drifted' }
          if ($stemIntegration.missingModulePlanStatus -ne 'BLOCKED') { throw 'Missing HTDemucs module did not block planning' }
          if ($stemIntegration.hpOmenExecutionProven -ne $false -or
              $stemIntegration.userSongSeparated -ne $false -or
              $stemIntegration.gpuInferenceProven -ne $false -or
              $stemIntegration.voiceConversionProven -ne $false -or
              $stemIntegration.executionAuthorized -ne $false) {
            throw 'Stem integration truth boundary drifted'
          }
          if ($planner.Contains('subprocess') -or $planner.Contains('shell=True')) {
            throw 'Planner must never execute shell commands'
          }
          Write-Host 'Echoes/K-Core capability planning contract PASS'

      - name: Upload K-Core integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: kcore-capability-integration-${{ matrix.os }}
          path: |
            artifacts/kcore-song-activity-integration.json
            artifacts/kcore-stem-integration.json
          if-no-files-found: error
          retention-days: 14
