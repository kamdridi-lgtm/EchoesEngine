name: Echoes Audio A-B-C Regression

on:
  pull_request:
    paths:
      - "app/standalone_processor.cpp"
      - "engine/**"
      - "cmake/standalone/**"
      - "config/echoes-capability-registry.v1.json"
      - "tools/audio_abc_regression.py"
      - ".github/workflows/audio-abc-regression.yml"
  push:
    branches:
      - main
    paths:
      - "app/standalone_processor.cpp"
      - "engine/**"
      - "cmake/standalone/**"
      - "config/echoes-capability-registry.v1.json"
      - "tools/audio_abc_regression.py"
      - ".github/workflows/audio-abc-regression.yml"

permissions:
  contents: read

jobs:
  analyzer-contract:
    name: Audio proof analyzer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audio_abc_regression.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and prove analyzer decisions
        run: |
          python -m py_compile tools/audio_abc_regression.py
          python tools/audio_abc_regression.py --self-test
      - name: Verify objective proof contract
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'tools/audio_abc_regression.py' -Raw
          foreach ($token in @(
            'echoes.audio-abc-proof.v1',
            'BYPASS_NOT_TRANSPARENT',
            'PROCESSED_PATH_DID_NOT_CHANGE_AUDIO',
            'PROCESSED_OUTPUT_CLIPPED',
            'PROCESSED_DC_OFFSET_EXCESSIVE',
            'sourceToBypass',
            'bypassToProcessed',
            'sha256'
          )) {
            if (-not $source.Contains($token)) { throw "Audio A/B/C token missing: $token" }
          }
          Write-Host 'Audio A/B/C analyzer contract PASS'

  native-windows-proof:
    name: Native Echoes A-B-C proof
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout native engine and analyzer
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cmake/standalone
            engine
            app
            tools/audio_abc_regression.py
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify explicit transparent bypass contract
        shell: pwsh
        run: |
          $cli = Get-Content -LiteralPath 'app/standalone_processor.cpp' -Raw
          foreach ($token in @(
            '--bypass-all',
            'Transparent bypass reference selected',
            'no DSP is executed',
            'no Gain, Gate, Compressor, EQ, AI, Spatial, MixBus, or Emotional processing'
          )) {
            if (-not $cli.Contains($token)) { throw "Transparent bypass token missing: $token" }
          }
          Write-Host 'Explicit transparent bypass contract PASS'

      - name: Configure and build native engine
        shell: pwsh
        run: |
          cmake -S cmake/standalone -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build --config Release --target EchoesStandaloneCI -- /m:1 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Echoes native build failed' }

      - name: Generate deterministic dynamic PCM16 fixture
        shell: python
        run: |
          import math, struct, wave
          sample_rate = 44100
          duration = 1.25
          frames = int(sample_rate * duration)
          with wave.open('abc-source.wav', 'wb') as output:
              output.setnchannels(2)
              output.setsampwidth(2)
              output.setframerate(sample_rate)
              data = bytearray()
              for frame in range(frames):
                  t = frame / sample_rate
                  segment = frame / frames
                  envelope = 0.03 if segment < 0.2 else (0.48 if segment < 0.7 else 0.14)
                  left = envelope * (0.72 * math.sin(2 * math.pi * 110 * t) + 0.28 * math.sin(2 * math.pi * 880 * t))
                  right = envelope * (0.68 * math.sin(2 * math.pi * 165 * t) + 0.32 * math.sin(2 * math.pi * 1320 * t))
                  if frame % 4096 == 0:
                      left += 0.18
                      right -= 0.16
                  left = max(-0.95, min(0.95, left))
                  right = max(-0.95, min(0.95, right))
                  data.extend(struct.pack('<hh', int(left * 32767), int(right * 32767)))
              output.writeframes(data)
          print(f'Generated dynamic fixture frames={frames} sampleRate={sample_rate}')

      - name: Run transparent bypass and native processed paths
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter EchoesEngine.exe | Select-Object -First 1
          if (-not $exe) { throw 'EchoesEngine.exe was not produced' }
          & $exe.FullName abc-source.wav abc-bypass.wav --bypass-all 2>&1 | Tee-Object abc-bypass.log
          if ($LASTEXITCODE -ne 0) { throw 'Transparent bypass render failed' }
          & $exe.FullName abc-source.wav abc-processed.wav --input-gain 2 --output-gain -3 --gate-thresh -60 --comp-thresh -24 --comp-ratio 4 --verbose 2>&1 | Tee-Object abc-processed.log
          if ($LASTEXITCODE -ne 0) { throw 'Native processed render failed' }

      - name: Produce objective A-B-C evidence
        run: >-
          python tools/audio_abc_regression.py
          --input abc-source.wav
          --bypass abc-bypass.wav
          --processed abc-processed.wav
          --output audio-abc-proof.json

      - name: Verify native proof result
        shell: pwsh
        run: |
          $proof = Get-Content -LiteralPath 'audio-abc-proof.json' -Raw | ConvertFrom-Json
          if ($proof.status -ne 'PASS') { throw "Audio A/B/C proof failed: $($proof.blockers -join ', ')" }
          if (-not $proof.objectiveProof.geometryPreserved) { throw 'Audio geometry was not preserved' }
          if (-not $proof.objectiveProof.bypassTransparent) { throw 'Bypass path was not transparent' }
          if (-not $proof.objectiveProof.processedSignalChanged) { throw 'Processed path did not change the signal' }
          if (-not $proof.objectiveProof.processedFinite) { throw 'Processed path emitted non-finite samples' }
          if (-not $proof.objectiveProof.processedUnclipped) { throw 'Processed path clipped' }
          Write-Host 'Native EchoesEngine A/B/C regression PASS'

      - name: Upload native audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EchoesEngine-native-audio-abc-proof
          path: |
            abc-source.wav
            abc-bypass.wav
            abc-processed.wav
            abc-bypass.log
            abc-processed.log
            audio-abc-proof.json
          if-no-files-found: error
          retention-days: 14
