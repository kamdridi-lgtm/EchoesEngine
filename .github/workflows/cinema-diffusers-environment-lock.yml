name: Echoes Cinema Diffusers Environment Lock

on:
  pull_request:
    paths:
      - "providers/requirements-diffusers.txt"
      - "providers/diffusers_environment_lock.py"
      - "scripts/echoes-cinema-provider-worker.ps1"
      - "scripts/one-click-echoes-cinema.ps1"
      - ".github/workflows/cinema-diffusers-environment-lock.yml"
  push:
    branches:
      - main
    paths:
      - "providers/requirements-diffusers.txt"
      - "providers/diffusers_environment_lock.py"
      - "scripts/echoes-cinema-provider-worker.ps1"
      - "scripts/one-click-echoes-cinema.ps1"
      - ".github/workflows/cinema-diffusers-environment-lock.yml"

permissions:
  contents: read

jobs:
  exact-environment-lock:
    name: Exact dependency lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout lock sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            providers/requirements-diffusers.txt
            providers/diffusers_environment_lock.py
            scripts/echoes-cinema-provider-worker.ps1
            scripts/one-click-echoes-cinema.ps1
          sparse-checkout-cone-mode: false

      - name: Set up production Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile and self-test lock verifier
        run: |
          python -m py_compile providers/diffusers_environment_lock.py
          python providers/diffusers_environment_lock.py --self-test

      - name: Prove exact pins resolve for Python 3.10
        run: python -m pip install --dry-run --ignore-installed -r providers/requirements-diffusers.txt

      - name: Parse Windows orchestration
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -LiteralPath "scripts/echoes-cinema-provider-worker.ps1" -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath "scripts/one-click-echoes-cinema.ps1" -Raw))

      - name: Verify drift repair and autonomous synchronization contract
        shell: pwsh
        run: |
          $requirements = Get-Content -LiteralPath "providers/requirements-diffusers.txt" -Raw
          $verifier = Get-Content -LiteralPath "providers/diffusers_environment_lock.py" -Raw
          $worker = Get-Content -LiteralPath "scripts/echoes-cinema-provider-worker.ps1" -Raw
          $oneClick = Get-Content -LiteralPath "scripts/one-click-echoes-cinema.ps1" -Raw

          foreach ($pin in @(
            "diffusers==0.39.0",
            "transformers==4.57.6",
            "accelerate==1.14.0",
            "safetensors==0.8.0",
            "imageio==2.37.4",
            "imageio-ffmpeg==0.6.0"
          )) {
            if (-not $requirements.Contains($pin)) { throw "Missing exact dependency pin: $pin" }
          }
          foreach ($forbidden in @(">=", "<=", "~=", "<1", "<2", "<3", "<6")) {
            if ($requirements.Contains($forbidden)) { throw "Ranged dependency entered exact lock: $forbidden" }
          }
          foreach ($token in @(
            "DEPENDENCY_VERSION_DRIFT",
            "transformers==4.57.6",
            'drifted["transformers"] = "5.14.1"',
            "CPU_ONLY_TORCH",
            "CUDA_RUNTIME_UNAVAILABLE"
          )) {
            if (-not $verifier.Contains($token)) { throw "Verifier missing lock token: $token" }
          }
          foreach ($token in @(
            "diffusers_environment_lock.py",
            "expectedVersions",
            "installedVersions",
            "versionMismatches",
            "repair the pinned D-drive AI environment"
          )) {
            if (-not $worker.Contains($token)) { throw "Worker missing drift-repair token: $token" }
          }
          if ($oneClick.Split("diffusers_environment_lock.py").Count -lt 4) {
            throw "One-click does not synchronize, self-test, and compile the lock verifier"
          }
