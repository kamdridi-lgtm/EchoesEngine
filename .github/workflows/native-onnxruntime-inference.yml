name: Echoes Native ONNX Runtime Inference

on:
  pull_request:
    paths:
      - "engine/include/EchoesEngine/neural/OnnxRuntimeSession.h"
      - "engine/include/EchoesEngine/neural/NeuralScheduler.h"
      - "tests/native_onnxruntime/**"
      - "tests/native_neural_manager/**"
      - "tools/generate_reference_onnx_model.py"
      - "config/echoes-capability-registry.v1.json"
      - ".github/workflows/native-onnxruntime-inference.yml"
  push:
    branches: [main]
    paths:
      - "engine/include/EchoesEngine/neural/OnnxRuntimeSession.h"
      - "engine/include/EchoesEngine/neural/NeuralScheduler.h"
      - "tests/native_onnxruntime/**"
      - "tests/native_neural_manager/**"
      - "tools/generate_reference_onnx_model.py"
      - "config/echoes-capability-registry.v1.json"
      - ".github/workflows/native-onnxruntime-inference.yml"

permissions:
  contents: read

env:
  ORT_VERSION: "1.20.1"
  ORT_PACKAGE_SHA256: "9c32108e9a1c78b090a95c2a219f244dd5f067d4caf68fb0f967103f3f20839c"

jobs:
  native-inference:
    name: Native ONNX Runtime inference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    steps:
      - name: Checkout inference contract
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine/include
            tests/native_onnxruntime
            tests/native_neural_manager
            tools/generate_reference_onnx_model.py
            config/echoes-capability-registry.v1.json
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned ONNX model builder
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4" "onnx==1.16.2"

      - name: Generate deterministic reference model
        run: >-
          python tools/generate_reference_onnx_model.py
          --output artifacts/reference-transform.onnx
          --metadata artifacts/reference-model.json

      - name: Download and verify pinned ONNX Runtime package
        shell: python
        run: |
          import hashlib
          import os
          import pathlib
          import urllib.request
          import zipfile

          version = os.environ["ORT_VERSION"]
          expected = os.environ["ORT_PACKAGE_SHA256"].strip().lower()
          artifacts = pathlib.Path("artifacts")
          package = artifacts / f"microsoft.ml.onnxruntime.{version}.nupkg"
          artifacts.mkdir(parents=True, exist_ok=True)
          url = (
              "https://api.nuget.org/v3-flatcontainer/"
              f"microsoft.ml.onnxruntime/{version}/"
              f"microsoft.ml.onnxruntime.{version}.nupkg"
          )
          with urllib.request.urlopen(url, timeout=120) as response:
              package.write_bytes(response.read())
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          (artifacts / "ort-package-sha256.txt").write_text(
              actual + "\n", encoding="utf-8"
          )
          print(f"ONNXRUNTIME_PACKAGE_SHA256={actual}")
          if actual != expected:
              raise RuntimeError(
                  f"ONNX Runtime package digest mismatch: expected {expected}, actual {actual}"
              )
          destination = pathlib.Path("third_party") / "onnxruntime"
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(package) as archive:
              archive.extractall(destination)
          required = [
              destination / "build/native/include/onnxruntime_cxx_api.h",
              destination / (
                  "runtimes/win-x64/native/onnxruntime.lib"
                  if os.name == "nt"
                  else "runtimes/linux-x64/native/libonnxruntime.so"
              ),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise RuntimeError(f"ONNX Runtime package layout incomplete: {missing}")

      - name: Configure native inference contract
        run: cmake -S tests/native_onnxruntime -B build/native-onnxruntime -DORT_ROOT=${{ github.workspace }}/third_party/onnxruntime

      - name: Build native inference contract
        run: cmake --build build/native-onnxruntime --config Release

      - name: Execute real model load and inference
        shell: pwsh
        run: |
          $meta = Get-Content -LiteralPath 'artifacts/reference-model.json' -Raw | ConvertFrom-Json
          $exe = Get-ChildItem build/native-onnxruntime -Recurse -File |
            Where-Object { $_.Name -in @('echoes_onnxruntime_contract.exe', 'echoes_onnxruntime_contract') } |
            Select-Object -First 1
          if (-not $exe) { throw 'Native ONNX Runtime executable was not produced' }
          & $exe.FullName `
            'artifacts/reference-transform.onnx' `
            $meta.sha256 `
            ([string]$meta.sizeBytes) `
            'artifacts/onnx-runtime-proof.json' 2>&1 |
            Tee-Object artifacts/native-onnxruntime.log
          if ($LASTEXITCODE -ne 0) { throw "Native ONNX Runtime proof failed with exit code $LASTEXITCODE" }
          $text = Get-Content -LiteralPath 'artifacts/native-onnxruntime.log' -Raw
          foreach ($token in @(
            'model-loaded=true',
            'inference-executed=true',
            'output=1,3,-3,8',
            'repeat=deterministic',
            'shape-mismatch=blocked',
            'integrity-only=blocked',
            'provider=cpu',
            'gpu=false',
            'tensorrt=false',
            'execution=not-authorized'
          )) {
            if (-not $text.Contains($token)) { throw "Missing ONNX Runtime proof token: $token" }
          }

      - name: Verify proof and capability truth boundary
        shell: pwsh
        run: |
          $packageDigest = (Get-Content -LiteralPath 'artifacts/ort-package-sha256.txt' -Raw).Trim().ToLowerInvariant()
          if ($packageDigest -ne $env:ORT_PACKAGE_SHA256) { throw 'Pinned ONNX Runtime package digest evidence drifted' }
          $proof = Get-Content -LiteralPath 'artifacts/onnx-runtime-proof.json' -Raw | ConvertFrom-Json
          if ($proof.schema -ne 'echoes.onnx-runtime-inference-proof.v1' -or $proof.status -ne 'PASS') {
            throw 'ONNX Runtime proof schema or status invalid'
          }
          if (-not $proof.truthBoundary.cpuReferenceInferenceProven) { throw 'CPU reference inference not proven' }
          foreach ($field in @('productionModelProvisioned','voiceConversionProven','gpuInferenceProven','tensorRtInferenceProven')) {
            if ($proof.truthBoundary.$field -ne $false) { throw "$field must remain false" }
          }
          if ($proof.scheduler.executionAuthorized -ne $false) { throw 'Scheduler execution must remain unauthorized' }
          $registry = Get-Content -LiteralPath 'config/echoes-capability-registry.v1.json' -Raw | ConvertFrom-Json
          $module = $registry.engineModules.onnxRuntimeInference
          if ($module.status -ne 'REAL') { throw 'onnxRuntimeInference must be REAL after proof is pinned and green' }
          if ($module.packageSha256 -ne $env:ORT_PACKAGE_SHA256) { throw 'Registry ONNX Runtime package digest drifted' }
          if ($module.productionModelProvisioned -ne $false) { throw 'Production model must remain unproven' }
          if ($module.gpuInferenceProven -ne $false -or $module.tensorRtInferenceProven -ne $false) {
            throw 'GPU and TensorRT inference must remain unproven'
          }

      - name: Upload native inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-onnxruntime-inference-${{ matrix.os }}
          path: |
            artifacts/reference-model.json
            artifacts/ort-package-sha256.txt
            artifacts/onnx-runtime-proof.json
            artifacts/native-onnxruntime.log
          if-no-files-found: warn
          retention-days: 14
