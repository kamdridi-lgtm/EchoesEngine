name: Echoes Diffusers Provider Contract

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout provider contract sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RUN_FIRST_REAL_AI_CLIP.cmd
            providers
            scripts/bootstrap-cinema-ai.ps1
            scripts/cleanup-cinema-storage.ps1
            scripts/ensure-python-on-d.ps1
            scripts/run-first-real-ai-clip.ps1
            tools/assemble_render.py
            tools/cinema_job_service.py
            tools/cinema_job_runner.py
            tools/http_render_worker.py
            tools/python_render_manifest.py
            tools/render_capabilities.py
            tests/test_diffusers_provider_fail_closed.py
            tests/test_cinema_job_service_fail_closed.py
          sparse-checkout-cone-mode: false

      - name: Compile provider, capability, QC, manifest, and service modules
        run: |
          python3 -m py_compile \
            providers/diffusers_video_provider.py \
            providers/modelscope_proof_provider.py \
            providers/modelscope_low_vram_provider.py \
            tools/assemble_render.py \
            tools/cinema_job_service.py \
            tools/cinema_job_runner.py \
            tools/http_render_worker.py \
            tools/python_render_manifest.py \
            tools/render_capabilities.py \
            tests/test_diffusers_provider_fail_closed.py \
            tests/test_cinema_job_service_fail_closed.py

      - name: Verify compiler-free render manifest generator
        run: python3 tools/python_render_manifest.py --self-test

      - name: Verify fail-closed render capability contract
        run: python3 tools/render_capabilities.py

      - name: Verify RTX 2060 low-VRAM provider profile
        run: python3 providers/modelscope_low_vram_provider.py --self-test

      - name: Verify missing model is never reported as real
        run: python3 tests/test_diffusers_provider_fail_closed.py

      - name: Verify proof provider is fail-closed and non-commercial
        env:
          ECHOES_RENDER_TOKEN: contract-token
        run: python3 providers/modelscope_proof_provider.py --self-test

      - name: Parse Windows PowerShell launchers
        shell: pwsh
        run: |
          foreach ($path in @(
            "scripts/bootstrap-cinema-ai.ps1",
            "scripts/cleanup-cinema-storage.ps1",
            "scripts/ensure-python-on-d.ps1",
            "scripts/run-first-real-ai-clip.ps1"
          )) {
            $content = Get-Content $path -Raw
            [void][scriptblock]::Create($content)
            Write-Host "PowerShell syntax PASS: $path"
          }

      - name: Verify D-drive, compiler-free, low-VRAM, cleanup, capability, and proof contract
        shell: python
        run: |
          from pathlib import Path

          launcher = Path("RUN_FIRST_REAL_AI_CLIP.cmd").read_text(encoding="utf-8")
          runner_ps = Path("scripts/run-first-real-ai-clip.ps1").read_text(encoding="utf-8")
          cleanup = Path("scripts/cleanup-cinema-storage.ps1").read_text(encoding="utf-8")
          bootstrap = Path("scripts/bootstrap-cinema-ai.ps1").read_text(encoding="utf-8")
          ensure_python = Path("scripts/ensure-python-on-d.ps1").read_text(encoding="utf-8")
          runner_py = Path("tools/cinema_job_runner.py").read_text(encoding="utf-8")
          service_py = Path("tools/cinema_job_service.py").read_text(encoding="utf-8")
          http_worker = Path("tools/http_render_worker.py").read_text(encoding="utf-8")
          assemble = Path("tools/assemble_render.py").read_text(encoding="utf-8")
          capabilities = Path("tools/render_capabilities.py").read_text(encoding="utf-8")
          manifest_py = Path("tools/python_render_manifest.py").read_text(encoding="utf-8")
          low_vram = Path("providers/modelscope_low_vram_provider.py").read_text(encoding="utf-8")

          assert r"D:\A.I\EchoesCinema" in launcher
          assert r"D:\A.I\EchoesCinema" in runner_ps
          assert r"D:\A.I\EchoesCinema\.venv-cinema" in bootstrap
          assert r"D:\A.I\Python310" in bootstrap
          assert r"D:\A.I\Python310" in ensure_python

          required = (
              "HF_HOME",
              "HF_HUB_CACHE",
              "TORCH_HOME",
              "PIP_CACHE_DIR",
              "CUDA_CACHE_PATH",
              "PYTHONPYCACHEPREFIX",
              "TEMP",
          )
          for name in required:
              assert name in runner_ps, f"runner missing {name}"
              assert name in bootstrap, f"bootstrap missing {name}"

          assert "%USERPROFILE%" not in launcher
          assert "Join-Path $env:USERPROFILE" not in runner_ps
          assert "Join-Path $env:USERPROFILE" not in bootstrap
          assert "systemDriveWritesAllowed = $false" in runner_ps
          assert '"systemDriveWritesAllowed": False' in bootstrap

          assert "ensure-python-on-d.ps1" in bootstrap
          assert 'if ($PythonLauncher -and $PythonLauncher -ne "py"' in bootstrap
          assert '[string]$PythonVersion = "3.10.11"' in ensure_python
          assert "3.10.20" not in ensure_python
          assert "Download-OfficialInstaller" in ensure_python
          assert "Get-AuthenticodeSignature" in ensure_python
          assert "Python Software Foundation" in ensure_python
          assert "Get-FileHash" in ensure_python
          assert "TargetDir=$installRootFull" in ensure_python
          assert "Include_launcher=0" in ensure_python

          assert "function Test-PythonModuleImport" in bootstrap
          assert '$ErrorActionPreference = "SilentlyContinue"' in bootstrap
          assert "Test-PythonModuleImport -PythonPath $python -ModuleName \"torch\"" in bootstrap

          assert "Visual Studio 17 2022" not in runner_ps
          assert "Assert-Command \"cmake\"" not in runner_ps
          assert "compiler-free Python manifest path" in runner_ps
          assert 'default=None' in runner_py
          assert 'python_render_manifest.py' in runner_py
          assert 'echoes.render-manifest.v1' in manifest_py
          assert 'python-render-manifest-v1' in manifest_py
          assert "manifest_cli: Path | None" in service_py
          assert "if self.config.manifest_cli is not None" in service_py

          assert "modelscope_low_vram_provider.py" in runner_ps
          assert '"--width", "384"' in runner_ps
          assert '"--height", "216"' in runner_ps
          assert '"--fps", "4"' in runner_ps
          assert '"--max-frames", "16"' in runner_ps
          assert "enable_sequential_cpu_offload" in low_vram
          assert "enable_attention_slicing" in low_vram
          assert "enable_vae_slicing" in low_vram
          assert "enable_forward_chunking" in low_vram
          assert "OutOfMemoryError" in low_vram
          assert '"width": 320' in low_vram
          assert '"height": 184' in low_vram
          assert '"commercialUseAllowed": False' in low_vram

          assert launcher.count("cleanup-cinema-storage.ps1") == 2
          assert "-AfterRun" in launcher
          assert "cache\\pip" in cleanup
          assert "cache\\huggingface" in cleanup
          assert '".venv-cinema"' in cleanup
          assert '"proofs\\first-real-ai-clip"' in cleanup
          assert "KeepProofArchives = 2" in cleanup
          assert "build-first-real-cli" in cleanup

          assert "validate_provider_health" in http_worker
          assert "--require-commercial-use" in http_worker
          assert "requiredCapabilities" in http_worker
          assert '"sha256": sha256_file(output_path)' in http_worker
          assert "acceptingCommercialJobs" in service_py
          assert "commercialUseRequired" in service_py
          assert "task_requirements" in capabilities
          assert "referenceImage" in capabilities
          assert "subjectIdentity" in capabilities
          assert "commercialUseAllowed" in capabilities
          assert "MAX_AV_DRIFT_SECONDS" in assemble
          assert "avDriftSeconds" in assemble
          assert "sha256_file" in assemble
          assert "artifactEvidence" in runner_py
          assert "--require-commercial-use" in runner_py
          print("D-drive, compiler-free, fail-closed, low-VRAM, cleanup, capability, SHA-256, and A/V drift contract PASS")

      - name: Verify Cinema service rejects unverified providers
        run: python3 tests/test_cinema_job_service_fail_closed.py
