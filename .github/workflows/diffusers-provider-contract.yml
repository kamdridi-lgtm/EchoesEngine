name: Echoes Diffusers Provider Contract

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout provider contract sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RUN_FIRST_REAL_AI_CLIP.cmd
            providers
            scripts/bootstrap-cinema-ai.ps1
            scripts/ensure-python-on-d.ps1
            scripts/run-first-real-ai-clip.ps1
            tools/cinema_job_service.py
            tools/cinema_job_runner.py
            tests/test_diffusers_provider_fail_closed.py
            tests/test_cinema_job_service_fail_closed.py
          sparse-checkout-cone-mode: false

      - name: Compile provider and service modules
        run: |
          python3 -m py_compile \
            providers/diffusers_video_provider.py \
            providers/modelscope_proof_provider.py \
            tools/cinema_job_service.py \
            tools/cinema_job_runner.py \
            tests/test_diffusers_provider_fail_closed.py \
            tests/test_cinema_job_service_fail_closed.py

      - name: Verify missing model is never reported as real
        run: python3 tests/test_diffusers_provider_fail_closed.py

      - name: Verify proof provider is fail-closed and non-commercial
        env:
          ECHOES_RENDER_TOKEN: contract-token
        run: python3 providers/modelscope_proof_provider.py --self-test

      - name: Parse Windows PowerShell launchers
        shell: pwsh
        run: |
          foreach ($path in @(
            "scripts/bootstrap-cinema-ai.ps1",
            "scripts/ensure-python-on-d.ps1",
            "scripts/run-first-real-ai-clip.ps1"
          )) {
            $content = Get-Content $path -Raw
            [void][scriptblock]::Create($content)
            Write-Host "PowerShell syntax PASS: $path"
          }

      - name: Verify D-drive-only storage and stale-py recovery contract
        shell: python
        run: |
          from pathlib import Path

          launcher = Path("RUN_FIRST_REAL_AI_CLIP.cmd").read_text(encoding="utf-8")
          runner = Path("scripts/run-first-real-ai-clip.ps1").read_text(encoding="utf-8")
          bootstrap = Path("scripts/bootstrap-cinema-ai.ps1").read_text(encoding="utf-8")
          ensure_python = Path("scripts/ensure-python-on-d.ps1").read_text(encoding="utf-8")

          assert r"D:\A.I\EchoesCinema" in launcher
          assert r"D:\A.I\EchoesCinema" in runner
          assert r"D:\A.I\EchoesCinema\.venv-cinema" in bootstrap
          assert r"D:\A.I\Python310" in bootstrap
          assert r"D:\A.I\Python310" in ensure_python

          required = (
              "HF_HOME",
              "HF_HUB_CACHE",
              "TORCH_HOME",
              "PIP_CACHE_DIR",
              "CUDA_CACHE_PATH",
              "PYTHONPYCACHEPREFIX",
              "TEMP",
          )
          for name in required:
              assert name in runner, f"runner missing {name}"
              assert name in bootstrap, f"bootstrap missing {name}"

          assert "%USERPROFILE%" not in launcher
          assert "Join-Path $env:USERPROFILE" not in runner
          assert "Join-Path $env:USERPROFILE" not in bootstrap
          assert "systemDriveWritesAllowed = $false" in runner
          assert '"systemDriveWritesAllowed": False' in bootstrap

          assert "ensure-python-on-d.ps1" in bootstrap
          assert 'if ($PythonLauncher -and $PythonLauncher -ne "py"' in bootstrap
          assert "https://www.python.org/ftp/python/" in ensure_python
          assert "Get-AuthenticodeSignature" in ensure_python
          assert "Python Software Foundation" in ensure_python
          assert "TargetDir=$installRootFull" in ensure_python
          assert "Include_launcher=0" in ensure_python
          assert "Test-PythonCandidate" in ensure_python
          print("D-drive-only storage and stale-py recovery contract PASS")

      - name: Verify Cinema service rejects unverified providers
        run: python3 tests/test_cinema_job_service_fail_closed.py
