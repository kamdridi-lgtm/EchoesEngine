name: Apply Direct Hidden Child Process Repair

on:
  push:
    branches:
      - fix/hidden-child-processes-direct-2026-07-25
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-direct-source-repair:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/hidden-child-processes-direct-2026-07-25

      - name: Patch the real launcher sources
        shell: python
        run: |
          from pathlib import Path

          def replace_required(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8-sig")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Required source token was not found in {path}: {old}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          supervisor = Path("scripts/echoes-cinema-stack-supervisor.ps1")
          replace_required(
              supervisor,
              "-RedirectStandardOutput $serviceStdout -RedirectStandardError $serviceStderr -PassThru",
              "-RedirectStandardOutput $serviceStdout -RedirectStandardError $serviceStderr -WindowStyle Hidden -PassThru",
          )

          worker = Path("scripts/echoes-cinema-provider-worker.ps1")
          replace_required(
              worker,
              "-RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru",
              "-RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -WindowStyle Hidden -PassThru",
          )
          replace_required(
              worker,
              "-RedirectStandardOutput $bridgeStdout -RedirectStandardError $bridgeStderr -PassThru",
              "-RedirectStandardOutput $bridgeStdout -RedirectStandardError $bridgeStderr -WindowStyle Hidden -PassThru",
          )
          old_bootstrap = "            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bootstrap -VenvPath $venvRoot -TorchIndexUrl $TorchIndexUrl\n            $bootstrapExit = $LASTEXITCODE"
          new_bootstrap = "\n".join([
              "            $bootstrapArguments = @(",
              "                \"-NoProfile\", \"-ExecutionPolicy\", \"Bypass\",",
              "                \"-File\", $bootstrap,",
              "                \"-VenvPath\", $venvRoot,",
              "                \"-TorchIndexUrl\", $TorchIndexUrl",
              "            )",
              "            $bootstrapProcess = Start-Process -FilePath \"powershell.exe\" -ArgumentList $bootstrapArguments -WindowStyle Hidden -Wait -PassThru",
              "            $bootstrapExit = $bootstrapProcess.ExitCode",
          ])
          replace_required(worker, old_bootstrap, new_bootstrap)

          text = worker.read_text(encoding="utf-8")
          provider_old = "Start-Process -FilePath $venvPython -ArgumentList $arguments -WorkingDirectory $workspace -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru"
          provider_new = "Start-Process -FilePath $venvPython -ArgumentList $arguments -WorkingDirectory $workspace -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -WindowStyle Hidden -PassThru"
          if provider_old in text:
              worker.write_text(text.replace(provider_old, provider_new), encoding="utf-8", newline="\n")

      - name: Parse and validate repaired PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $supervisorPath = 'scripts/echoes-cinema-stack-supervisor.ps1'
          $workerPath = 'scripts/echoes-cinema-provider-worker.ps1'
          [void][scriptblock]::Create((Get-Content -LiteralPath $supervisorPath -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath $workerPath -Raw))
          $combined = (Get-Content -LiteralPath $supervisorPath -Raw) + (Get-Content -LiteralPath $workerPath -Raw)
          foreach ($token in @(
            '-RedirectStandardOutput $serviceStdout -RedirectStandardError $serviceStderr -WindowStyle Hidden -PassThru',
            '-RedirectStandardOutput $providerWorkerStdout -RedirectStandardError $providerWorkerStderr -WindowStyle Hidden -PassThru',
            '-RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -WindowStyle Hidden -PassThru',
            '-RedirectStandardOutput $bridgeStdout -RedirectStandardError $bridgeStderr -WindowStyle Hidden -PassThru',
            '-WindowStyle Hidden -Wait -PassThru'
          )) {
            if (-not $combined.Contains($token)) { throw "Repair validation failed: $token" }
          }
          if ($combined.Contains('& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bootstrap')) {
            throw 'Visible bootstrap invocation remains after repair.'
          }

      - name: Commit direct source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Echoes Cinema Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/echoes-cinema-stack-supervisor.ps1 scripts/echoes-cinema-provider-worker.ps1
          if (git diff --cached --quiet) {
            Write-Host 'Direct launcher sources were already repaired.'
            exit 0
          }
          git commit -m 'Hide every Echoes Cinema child process window'
          git push origin HEAD:fix/hidden-child-processes-direct-2026-07-25
