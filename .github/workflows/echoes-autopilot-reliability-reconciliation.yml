name: Echoes Autopilot Reliability Reconciliation

on:
  pull_request:
    paths:
      - "scripts/invoke-echoes-autopilot.ps1"
      - "scripts/install-echoes-autopilot-reliability-update.ps1"
      - "packaging/echoes-autopilot-reliability/**"
      - "tools/validate_autopilot_reliability_reconciliation.py"
      - ".github/workflows/echoes-autopilot-reliability-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/invoke-echoes-autopilot.ps1"
      - "scripts/install-echoes-autopilot-reliability-update.ps1"
      - "packaging/echoes-autopilot-reliability/**"
      - "tools/validate_autopilot_reliability_reconciliation.py"
      - ".github/workflows/echoes-autopilot-reliability-reconciliation.yml"

permissions:
  contents: read

jobs:
  reliability-contract:
    name: Autopilot reliability contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/invoke-echoes-autopilot.ps1
            scripts/install-echoes-autopilot-reliability-update.ps1
            packaging/echoes-autopilot-reliability/START-ECHOES-AUTOPILOT-RELIABILITY-UPDATE.cmd
            tools/validate_autopilot_reliability_reconciliation.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate reliability contract
        run: >-
          python tools/validate_autopilot_reliability_reconciliation.py
          --launcher scripts/invoke-echoes-autopilot.ps1
          --installer scripts/install-echoes-autopilot-reliability-update.ps1
          --entrypoint packaging/echoes-autopilot-reliability/START-ECHOES-AUTOPILOT-RELIABILITY-UPDATE.cmd
          --output artifacts/autopilot-reliability-reconciliation-proof.json

      - name: Parse PowerShell on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/invoke-echoes-autopilot.ps1',
            'scripts/install-echoes-autopilot-reliability-update.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

      - name: Assemble reliability update package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Echoes-Autopilot-Reliability-Update'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'scripts') | Out-Null
          Copy-Item 'packaging/echoes-autopilot-reliability/START-ECHOES-AUTOPILOT-RELIABILITY-UPDATE.cmd' $root
          Copy-Item 'scripts/install-echoes-autopilot-reliability-update.ps1' (Join-Path $root 'scripts')
          Copy-Item 'scripts/invoke-echoes-autopilot.ps1' (Join-Path $root 'scripts')
          Compress-Archive -Path $root -DestinationPath 'artifacts/Echoes-Autopilot-Reliability-Update-Windows.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: echoes-autopilot-reliability-${{ matrix.os }}
          path: |
            artifacts/autopilot-reliability-reconciliation-proof.json
            artifacts/Echoes-Autopilot-Reliability-Update-Windows.zip
          if-no-files-found: error
          retention-days: 14
