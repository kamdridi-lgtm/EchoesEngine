name: Apply P0 Real Input Audio Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-p0-real-input-audio:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/p0-real-input-audio-2026-07-25

      - name: Patch P0 autopilot and evidence bundle
        shell: python
        run: |
          from pathlib import Path

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Required patch token missing: {label}')
              return text.replace(old, new)

          path = Path('tools/cinema_p0_autopilot.py')
          text = path.read_text(encoding='utf-8-sig')
          text = text.replace('import math\n', '')
          text = text.replace('import struct\n', '')
          text = text.replace('import wave\n', '')
          text = replace_required(
              text,
              'from typing import Any\n',
              'from typing import Any\n\nimport cinema_real_input_audio as real_audio\n',
              'real audio module import',
          )
          text = replace_required(
              text,
              '        self.audio_path = self.output_root / "proof-audio.wav"\n',
              '        self.audio_path = self.output_root / "proof-audio.wav"\n        self.audio_evidence_path = self.output_root / "proof-audio-source.json"\n',
              'audio evidence path',
          )
          old_final_evidence = (
              '        if not isinstance(final_evidence, dict) or not final_evidence.get("sha256"):\n'
              '            return False, "final MP4 SHA-256 evidence is missing"\n'
          )
          new_final_evidence = old_final_evidence + (
              '        audio_evidence = load_json(self.audio_evidence_path)\n'
              '        if not audio_evidence or audio_evidence.get("status") != "PASS":\n'
              '            return False, "real input audio evidence is missing or not PASS"\n'
              '        if audio_evidence.get("generatedByAutopilot") is not False:\n'
              '            return False, "P0 audio was generated by the autopilot instead of using real input"\n'
              '        if not audio_evidence.get("sourceSha256") or not audio_evidence.get("outputSha256"):\n'
              '            return False, "real input audio SHA-256 evidence is missing"\n'
          )
          text = replace_required(text, old_final_evidence, new_final_evidence, 'verified proof audio evidence')
          text = text.replace(
              '        return True, "Model load, REAL backend, QC, MP4, SHA-256, and resume evidence passed."',
              '        return True, "Real input audio, model load, REAL backend, QC, MP4, SHA-256, and resume evidence passed."',
          )

          start = text.find('    def _write_audio(self) -> None:\n')
          end = text.find('    def _copy_provider_logs(self) -> None:\n')
          if start < 0 and '    def _wait_for_real_audio(self) -> dict[str, Any]:\n' not in text:
              raise SystemExit('Required patch token missing: _write_audio method')
          if start >= 0:
              if end <= start:
                  raise SystemExit('Could not locate _write_audio method boundary')
              method = (
                  '    def _wait_for_real_audio(self) -> dict[str, Any]:\n'
                  '        deadline = time.monotonic() + max(30.0, self.config.wait_timeout_seconds)\n'
                  '        explicit_path = os.getenv("ECHOES_CINEMA_P0_AUDIO")\n'
                  '        last_status_write = 0.0\n'
                  '        while not self._stop_event.is_set() and time.monotonic() < deadline:\n'
                  '            source, selection_method = real_audio.discover_real_input(\n'
                  '                self.config.workspace, explicit_path\n'
                  '            )\n'
                  '            if source is not None:\n'
                  '                return real_audio.prepare_real_input(\n'
                  '                    source,\n'
                  '                    self.audio_path,\n'
                  '                    self.audio_evidence_path,\n'
                  '                    selection_method=selection_method,\n'
                  '                    proof_duration_seconds=PROOF_DURATION_SECONDS,\n'
                  '                )\n'
                  '            now = time.monotonic()\n'
                  '            if now - last_status_write >= 15.0:\n'
                  '                self._write_status(\n'
                  '                    "PARTIAL",\n'
                  '                    "WAITING_INPUT_AUDIO",\n'
                  '                    "P0 is waiting for a real song file. Synthetic fallback audio is disabled.",\n'
                  '                    blocker=f"No supported audio file was found in {self.config.workspace / \'input\'}",\n'
                  '                    extra={\n'
                  '                        "inputDirectory": str(self.config.workspace / "input"),\n'
                  '                        "supportedExtensions": sorted(real_audio.SUPPORTED_EXTENSIONS),\n'
                  '                        "syntheticFallbackAllowed": False,\n'
                  '                    },\n'
                  '                )\n'
                  '                last_status_write = now\n'
                  '            self._stop_event.wait(5.0)\n'
                  '        if self._stop_event.is_set():\n'
                  '            raise RuntimeError("P0 autopilot stopped before real input audio became available")\n'
                  '        raise RuntimeError(\n'
                  '            f"timed out after {int(self.config.wait_timeout_seconds)} seconds waiting for real input audio in "\n'
                  '            f"{self.config.workspace / \'input\'}"\n'
                  '        )\n\n'
              )
              text = text[:start] + method + text[end:]

          old_run = (
              '            self._write_status(\n'
              '                "PARTIAL",\n'
              '                "WAITING_PROVIDER",\n'
              '                "The control center is online. P0 will start automatically when the real model is ready.",\n'
              '                blocker=detail,\n'
              '            )\n'
              '            health = self._wait_for_provider()\n'
              '            self._archive_old_failure()\n'
              '            self._copy_provider_logs()\n'
              '            self._write_audio()\n'
          )
          new_run = (
              '            self._write_status(\n'
              '                "PARTIAL",\n'
              '                "WAITING_INPUT_AUDIO",\n'
              '                "P0 is selecting a real song input before any render begins.",\n'
              '                blocker=detail,\n'
              '                extra={"syntheticFallbackAllowed": False},\n'
              '            )\n'
              '            audio_evidence = self._wait_for_real_audio()\n'
              '            self._write_status(\n'
              '                "PARTIAL",\n'
              '                "WAITING_PROVIDER",\n'
              '                "Real input audio is verified. P0 is waiting for the real model to finish loading.",\n'
              '                extra={\n'
              '                    "audioSource": audio_evidence.get("sourcePath"),\n'
              '                    "audioSourceSha256": audio_evidence.get("sourceSha256"),\n'
              '                    "audioEvidence": str(self.audio_evidence_path),\n'
              '                    "syntheticFallbackAllowed": False,\n'
              '                },\n'
              '            )\n'
              '            health = self._wait_for_provider()\n'
              '            self._archive_old_failure()\n'
              '            self._copy_provider_logs()\n'
          )
          text = replace_required(text, old_run, new_run, 'P0 run real input gate')
          text = replace_required(
              text,
              '                    "gpuName": (health.get("gpu") or {}).get("name") if isinstance(health.get("gpu"), dict) else None,\n',
              '                    "gpuName": (health.get("gpu") or {}).get("name") if isinstance(health.get("gpu"), dict) else None,\n                    "audioSource": audio_evidence.get("sourcePath"),\n                    "audioSourceSha256": audio_evidence.get("sourceSha256"),\n                    "audioEvidence": str(self.audio_evidence_path),\n                    "syntheticFallbackAllowed": False,\n',
              'rendering audio evidence',
          )
          text = replace_required(
              text,
              '                    "videoQc": str(self.qc_path),\n',
              '                    "videoQc": str(self.qc_path),\n                    "audioEvidence": str(self.audio_evidence_path),\n                    "audioSourceSha256": audio_evidence.get("sourceSha256"),\n',
              'complete audio evidence',
          )
          text = replace_required(
              text,
              '        autopilot.final_mp4.write_bytes(b"fake-mp4-proof")\n        verified, reason = autopilot.verified_proof()\n',
              '        autopilot.final_mp4.write_bytes(b"fake-mp4-proof")\n        atomic_json(\n            autopilot.audio_evidence_path,\n            {\n                "status": "PASS",\n                "generatedByAutopilot": False,\n                "sourceSha256": "b" * 64,\n                "outputSha256": "c" * 64,\n            },\n        )\n        verified, reason = autopilot.verified_proof()\n',
              'self-test audio evidence',
          )
          text = text.replace(
              '        autopilot._write_audio()\n        assert autopilot.audio_path.is_file() and autopilot.audio_path.stat().st_size > 44\n',
              '',
          )
          text = text.replace(
              'CinemaP0Autopilot PASS idempotent-proof=validated audio=validated secrets=absent resume=required',
              'CinemaP0Autopilot PASS idempotent-proof=validated real-input-audio=required secrets=absent resume=required',
          )
          if 'def _write_audio' in text or 'math.sin' in text:
              raise SystemExit('Synthetic P0 audio fallback remains after patch')
          path.write_text(text, encoding='utf-8', newline='\n')

          bundle_path = Path('tools/cinema_p0_evidence_bundle.py')
          bundle = bundle_path.read_text(encoding='utf-8-sig')
          bundle = replace_required(
              bundle,
              '    "proof-audio.wav",\n',
              '    "proof-audio-source.json",\n    "proof-audio.wav",\n',
              'evidence bundle audio source manifest',
          )
          bundle = replace_required(
              bundle,
              '    qc = load_json(proof_dir / "video-qc.json")\n',
              '    qc = load_json(proof_dir / "video-qc.json")\n    audio_evidence = load_json(proof_dir / "proof-audio-source.json")\n',
              'bundle audio evidence load',
          )
          bundle = replace_required(
              bundle,
              '    if result and result.get("status") == "PASS" and result.get("backendStatus") == "REAL":\n        if qc and qc.get("status") == "PASS" and top_level_mp4:\n',
              '    if result and result.get("status") == "PASS" and result.get("backendStatus") == "REAL":\n        if not audio_evidence or audio_evidence.get("status") != "PASS":\n            return "PARTIAL", "The job reports REAL, but real input audio evidence is missing or not PASS."\n        if audio_evidence.get("generatedByAutopilot") is not False:\n            return "PARTIAL", "The job reports REAL, but P0 audio was generated by the autopilot."\n        if qc and qc.get("status") == "PASS" and top_level_mp4:\n',
              'bundle truth gate',
          )
          bundle_path.write_text(bundle, encoding='utf-8', newline='\n')

      - name: Compile and execute contracts
        shell: bash
        run: |
          python -m py_compile tools/cinema_real_input_audio.py tools/cinema_p0_autopilot.py tools/cinema_p0_evidence_bundle.py
          python tools/cinema_real_input_audio.py --self-test
          python tools/cinema_p0_autopilot.py
          python tools/cinema_p0_evidence_bundle.py --self-test

      - name: Commit production source changes
        shell: bash
        run: |
          git config user.name 'Echoes Cinema Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/cinema_p0_autopilot.py tools/cinema_p0_evidence_bundle.py
          if git diff --cached --quiet; then
            echo 'P0 real input audio source was already repaired.'
            exit 0
          fi
          git commit -m 'Require real input audio for P0 renders'
          git push origin HEAD:feature/p0-real-input-audio-2026-07-25
