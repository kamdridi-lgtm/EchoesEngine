name: Echoes Silero VAD Production Proof

on:
  pull_request:
    paths:
      - "tools/provision_silero_vad.py"
      - "tools/prove_silero_vad.py"
      - "config/echoes-capability-registry.v1.json"
      - ".github/workflows/silero-vad-production-proof.yml"
  push:
    branches: [main]
    paths:
      - "tools/provision_silero_vad.py"
      - "tools/prove_silero_vad.py"
      - "config/echoes-capability-registry.v1.json"
      - ".github/workflows/silero-vad-production-proof.yml"

permissions:
  contents: read

jobs:
  production-proof:
    name: Silero VAD production inference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    steps:
      - name: Checkout production model contract
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/provision_silero_vad.py
            tools/prove_silero_vad.py
            config/echoes-capability-registry.v1.json
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned ONNX runtime and inspector
        run: >-
          python -m pip install --disable-pip-version-check
          "numpy==1.26.4" "onnx==1.16.2" "onnxruntime==1.20.1"

      - name: Provision pinned official production model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/silero-vad | Out-Null
          python tools/provision_silero_vad.py `
            --output-dir artifacts/silero-vad `
            --expected-model-sha256 1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3 `
            --expected-model-size 2327524 2>&1 | Tee-Object artifacts/silero-vad/provisioning.log
          if ($LASTEXITCODE -ne 0) { throw "Silero provisioning failed with exit $LASTEXITCODE" }
          $manifest = Get-Content -LiteralPath 'artifacts/silero-vad/silero-vad-provisioning.json' -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 'echoes.silero-vad-provisioning.v1' -or $manifest.status -ne 'PASS') {
            throw 'Pinned Silero provisioning manifest is invalid'
          }
          if ($manifest.package.sha256 -ne '09de93c4d874bb19c53e62a47dd38be5f163cedad2b5599583231f2a84ef79cb') {
            throw 'Official wheel digest drifted'
          }
          if ($manifest.selectedModel.sha256 -ne '1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3' -or $manifest.selectedModel.sizeBytes -ne 2327524) {
            throw 'Official Silero model digest or size drifted'
          }
          if ($manifest.licence.declared -ne 'MIT' -or -not $manifest.licence.commercialUseAllowed) {
            throw 'Silero licence evidence is missing or non-commercial'
          }
          if (-not $manifest.truthBoundary.productionModelIntegrityProven) {
            throw 'Production model integrity was not proven'
          }

      - name: Discover real streaming inference evidence
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python tools/prove_silero_vad.py `
            --model artifacts/silero-vad/model/silero_vad.onnx `
            --output-dir artifacts/silero-vad `
            --expected-sample-sha256 PIN_AFTER_DISCOVERY 2>&1 | Tee-Object artifacts/silero-vad/inference.log
          $code = $LASTEXITCODE
          if ($code -ne 3) { throw "Expected sample discovery gate exit 3, received $code" }
          $proof = Get-Content -LiteralPath 'artifacts/silero-vad/silero-vad-inference.json' -Raw | ConvertFrom-Json
          if ($proof.schema -ne 'echoes.silero-vad-inference-proof.v1' -or $proof.status -ne 'DISCOVERY') {
            throw 'Silero inference discovery proof is invalid'
          }
          foreach ($name in @('probabilitiesFinite','probabilitiesBounded','resetDeterministic','recurrentStateChanged','invalidChunkBlocked')) {
            if (-not $proof.checks.$name) { throw "Silero discovery check failed: $name" }
          }
          if ($proof.runtime.provider -ne 'CPUExecutionProvider') { throw 'Silero discovery must remain CPU-only' }
          if ($proof.truthBoundary.productionModelInferenceProven -ne $false) {
            throw 'Production inference must remain unproven until the sample is pinned'
          }

      - name: Upload Silero production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silero-vad-production-${{ matrix.os }}
          path: |
            artifacts/silero-vad/silero-vad-provisioning.json
            artifacts/silero-vad/silero-vad-inference.json
            artifacts/silero-vad/provisioning.log
            artifacts/silero-vad/inference.log
          if-no-files-found: error
          retention-days: 14
