name: PromptDirector Smoke

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          rm -rf build-prompt
          set -o pipefail
          cmake -S cmake/prompt_director -B build-prompt 2>&1 | tee prompt-configure.log

      - name: Build prompt pipeline tools
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-prompt --config Release --target PromptDirectorSmoke ShotPlannerSmoke ShotPlanCli 2>&1 | tee prompt-build.log

      - name: Run smoke tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-prompt -C Release --output-on-failure -V 2>&1 | tee prompt-test.log

      - name: Verify generated shot plan
        shell: python
        run: |
          import json
          import pathlib
          import shutil

          source = pathlib.Path("build-prompt/shot-plan.json")
          if not source.is_file():
              raise SystemExit(f"missing generated shot plan: {source.resolve()}")

          payload = json.loads(source.read_text(encoding="utf-8"))
          if payload.get("schema") != "echoes.shot-plan.v1":
              raise SystemExit("invalid shot plan schema")
          shots = payload.get("shots")
          if not isinstance(shots, list) or not shots:
              raise SystemExit("shot plan contains no shots")
          for index, shot in enumerate(shots):
              if not shot.get("camera"):
                  raise SystemExit(f"shot {index} has no camera")
              if not shot.get("prompt"):
                  raise SystemExit(f"shot {index} has no prompt")

          destination = pathlib.Path("shot-plan-${{ matrix.os }}.json")
          shutil.copyfile(source, destination)
          print(f"Verified {len(shots)} shots in {source}")

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-director-smoke-${{ matrix.os }}
          path: |
            prompt-configure.log
            prompt-build.log
            prompt-test.log
            shot-plan-${{ matrix.os }}.json
          if-no-files-found: ignore
          retention-days: 14
