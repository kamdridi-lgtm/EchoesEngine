name: PromptDirector Smoke

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          rm -rf build-prompt
          set -o pipefail
          cmake -S cmake/prompt_director -B build-prompt 2>&1 | tee prompt-configure.log

      - name: Build all smoke targets
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-prompt --config Release --target PromptDirectorSmoke ShotPlannerSmoke 2>&1 | tee prompt-build.log

      - name: Run smoke tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-prompt -C Release --output-on-failure -V 2>&1 | tee prompt-test.log

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-director-smoke-${{ matrix.os }}
          path: |
            prompt-configure.log
            prompt-build.log
            prompt-test.log
          if-no-files-found: ignore
          retention-days: 14
