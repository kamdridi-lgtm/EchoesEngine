name: Echoes Cinema CUDA Environment Repair

on:
  pull_request:
    paths:
      - "scripts/bootstrap-cinema-ai.ps1"
      - "scripts/echoes-cinema-provider-worker.ps1"
      - "providers/provider_bootstrap_health_bridge.py"
      - ".github/workflows/cinema-cuda-environment-repair.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/bootstrap-cinema-ai.ps1"
      - "scripts/echoes-cinema-provider-worker.ps1"
      - "providers/provider_bootstrap_health_bridge.py"
      - ".github/workflows/cinema-cuda-environment-repair.yml"

permissions:
  contents: read

jobs:
  cuda-environment-repair:
    name: CPU torch repair and CUDA blocker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout CUDA repair sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/bootstrap-cinema-ai.ps1
            scripts/echoes-cinema-provider-worker.ps1
            providers/provider_bootstrap_health_bridge.py
          sparse-checkout-cone-mode: false

      - name: Parse PowerShell repair chain
        shell: pwsh
        run: |
          foreach ($path in @(
            "scripts/bootstrap-cinema-ai.ps1",
            "scripts/echoes-cinema-provider-worker.ps1"
          )) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $path -Raw))
          }

      - name: Prove torch repair classification
        shell: pwsh
        run: |
          & "scripts/bootstrap-cinema-ai.ps1" -TorchProbeSelfTest
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap torch probe self-test failed" }

      - name: Prove worker environment classification
        shell: pwsh
        run: |
          & "scripts/echoes-cinema-provider-worker.ps1" -EnvironmentProbeSelfTest
          if ($LASTEXITCODE -ne 0) { throw "Provider worker environment self-test failed" }

      - name: Prove bridge keeps permanent blocker truthful
        run: python providers/provider_bootstrap_health_bridge.py --self-test

      - name: Verify automatic repair and fail-closed contract
        shell: pwsh
        run: |
          $bootstrap = Get-Content -LiteralPath "scripts/bootstrap-cinema-ai.ps1" -Raw
          $worker = Get-Content -LiteralPath "scripts/echoes-cinema-provider-worker.ps1" -Raw
          $bridge = Get-Content -LiteralPath "providers/provider_bootstrap_health_bridge.py" -Raw
          foreach ($token in @(
            "REPLACE_CPU_WHEEL",
            "--force-reinstall",
            "torch.version.cuda",
            "official CUDA wheel"
          )) {
            if (-not $bootstrap.Contains($token)) { throw "Bootstrap missing repair token: $token" }
          }
          foreach ($token in @(
            "CPU_ONLY_TORCH",
            "CUDA_RUNTIME_UNAVAILABLE",
            'status = "BLOCKED"',
            "operatorRestartRequired",
            "stop.signal"
          )) {
            if (-not $worker.Contains($token)) { throw "Worker missing blocker token: $token" }
          }
          foreach ($token in @(
            '"operatorRestartRequired"',
            '"torchCudaVersion"',
            'assert blocked["loadState"] == "BLOCKED"'
          )) {
            if (-not $bridge.Contains($token)) { throw "Bridge missing truthful-health token: $token" }
          }
