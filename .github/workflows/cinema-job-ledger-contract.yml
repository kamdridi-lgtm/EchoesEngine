name: Echoes Cinema Durable Job Ledger

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout durable service sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/start-cinema-job-service.ps1
            tools/cinema_job_ledger.py
            tools/cinema_job_runner.py
            tools/cinema_job_service.py
            tools/cinema_job_service_durable.py
            tools/render_capabilities.py
            tools/render_resume.py
            tools/resumable_http_render_worker.py
          sparse-checkout-cone-mode: false

      - name: Compile ledger, durable service, runner, and resume worker
        run: |
          python3 -m py_compile \
            tools/cinema_job_ledger.py \
            tools/cinema_job_runner.py \
            tools/cinema_job_service.py \
            tools/cinema_job_service_durable.py \
            tools/render_capabilities.py \
            tools/render_resume.py \
            tools/resumable_http_render_worker.py

      - name: Parse Windows durable-service launcher
        shell: pwsh
        run: |
          $content = Get-Content "scripts/start-cinema-job-service.ps1" -Raw
          [void][scriptblock]::Create($content)
          Write-Host "Durable Cinema service launcher syntax PASS"

      - name: Verify atomic persistence and restart recovery
        run: python3 tools/cinema_job_ledger.py --self-test

      - name: Verify fail-closed durable resume service contract
        shell: python
        run: |
          from pathlib import Path

          ledger = Path("tools/cinema_job_ledger.py").read_text(encoding="utf-8")
          service = Path("tools/cinema_job_service_durable.py").read_text(encoding="utf-8")
          runner = Path("tools/cinema_job_runner.py").read_text(encoding="utf-8")
          resume_worker = Path("tools/resumable_http_render_worker.py").read_text(encoding="utf-8")
          launcher = Path("scripts/start-cinema-job-service.ps1").read_text(encoding="utf-8")

          assert 'SCHEMA = "echoes.cinema-job-ledger.v1"' in ledger
          assert 'EVENT_SCHEMA = "echoes.cinema-job-ledger-event.v1"' in ledger
          assert 'os.replace(temp_path, path)' in ledger
          assert 'os.fsync(handle.fileno())' in ledger
          assert '"RECOVERABLE"' in ledger
          assert 'service restarted before a terminal result was recorded' in ledger
          assert 'invalid Cinema job transition' in ledger
          assert 'Cinema job ledger is unreadable or corrupt' in ledger
          assert 'TERMINAL_STATUSES = {"PASS", "FAILED", "BROKEN"}' in ledger

          assert 'class DurableJobRegistry(base.JobRegistry)' in service
          assert 'resumeRecovered' in service
          assert 'actionRequired' in service
          assert '"/v1/cinema/jobs"' in service
          assert 'job-ledger.json' in service
          assert 'self.ledger.transition' in service
          assert 'terminal_fields.pop(reserved, None)' in service
          assert 'No interrupted job is silently lost' in service
          assert 'self.resume_requested: set[str]' in service
          assert 'def _run_resume_job' in service
          assert '"--resume"' in service
          assert 'resumeRequested=resume_existing' in service
          assert 'SHA-256/media-validated clips' in service

          assert 'resumable_http_render_worker.py' in runner
          assert '"--resume"' in runner
          assert 'REUSED_VALIDATED' in resume_worker
          assert 'SHA256_AND_MEDIA_QC_VALIDATED' in resume_worker
          assert 'os.replace(temp_path, path)' in resume_worker

          assert 'D:\\A.I\\EchoesCinema\\jobs' in launcher
          assert 'D:\\A.I\\EchoesCinema\\.venv-cinema\\Scripts\\python.exe' in launcher
          assert 'cinema_job_service_durable.py' in launcher
          assert 'Cinema job output must not use drive C:' in launcher
          assert 'compiler-free Python' in launcher
          assert 'job-ledger.json' in launcher
          print("Durable Cinema ledger, evidence resume, restart safety, and D-drive launcher contract PASS")
