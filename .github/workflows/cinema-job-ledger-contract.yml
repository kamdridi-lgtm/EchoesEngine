name: Echoes Cinema Durable Job Ledger

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout durable service sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/start-cinema-job-service.ps1
            tools/cinema_job_ledger.py
            tools/cinema_job_runner.py
            tools/cinema_job_scheduler.py
            tools/cinema_job_service.py
            tools/cinema_job_service_durable.py
            tools/render_capabilities.py
            tools/render_resume.py
            tools/resumable_http_render_worker.py
          sparse-checkout-cone-mode: false

      - name: Compile ledger, scheduler, durable service, runner, and resume worker
        run: |
          python3 -m py_compile \
            tools/cinema_job_ledger.py \
            tools/cinema_job_runner.py \
            tools/cinema_job_scheduler.py \
            tools/cinema_job_service.py \
            tools/cinema_job_service_durable.py \
            tools/render_capabilities.py \
            tools/render_resume.py \
            tools/resumable_http_render_worker.py

      - name: Parse Windows durable-service launcher
        shell: pwsh
        run: |
          $content = Get-Content "scripts/start-cinema-job-service.ps1" -Raw
          [void][scriptblock]::Create($content)
          Write-Host "Durable Cinema service launcher syntax PASS"

      - name: Verify atomic persistence and restart recovery
        run: python3 tools/cinema_job_ledger.py --self-test

      - name: Verify priority, bounded concurrency, and storage admission
        run: python3 tools/cinema_job_scheduler.py --self-test

      - name: Verify fail-closed durable scheduler and resume service contract
        shell: python
        run: |
          from pathlib import Path

          ledger = Path("tools/cinema_job_ledger.py").read_text(encoding="utf-8")
          scheduler = Path("tools/cinema_job_scheduler.py").read_text(encoding="utf-8")
          service = Path("tools/cinema_job_service_durable.py").read_text(encoding="utf-8")
          runner = Path("tools/cinema_job_runner.py").read_text(encoding="utf-8")
          resume_worker = Path("tools/resumable_http_render_worker.py").read_text(encoding="utf-8")
          launcher = Path("scripts/start-cinema-job-service.ps1").read_text(encoding="utf-8")

          required = {
            "ledger": [
              'SCHEMA = "echoes.cinema-job-ledger.v1"',
              'EVENT_SCHEMA = "echoes.cinema-job-ledger-event.v1"',
              'os.replace(temp_path, path)',
              'os.fsync(handle.fileno())',
              '"RECOVERABLE"',
              'service restarted before a terminal result was recorded',
              'invalid Cinema job transition',
              'Cinema job ledger is unreadable or corrupt',
              'TERMINAL_STATUSES = {"PASS", "FAILED", "BROKEN"}',
            ],
            "scheduler": [
              'class StorageAdmissionError',
              'class StorageBudget',
              'class PriorityJobScheduler',
              'queue.PriorityQueue',
              'sort_key=(-parsed_priority, sequence)',
              'minimumFreeBytes',
              'projectedFreeBytes',
              'insufficient storage for Cinema job',
              'recentWorkerFailures',
              'maxWorkers',
              'CinemaJobScheduler PASS',
            ],
            "service": [
              'class DurableJobRegistry(base.JobRegistry)',
              'PriorityJobScheduler',
              'resumeRecovered',
              'actionRequired',
              '"/v1/cinema/jobs"',
              '"/v1/cinema/scheduler"',
              'job-ledger.json',
              'self.ledger.transition',
              'terminal_fields.pop(reserved, None)',
              'self.resume_requested: set[str]',
              'def _run_resume_job',
              '"--resume"',
              'resumeRequested=resume_existing',
              'request_priority',
              'estimatedOutputBytes',
              'reserve_storage',
              'submit_reserved',
              'ECHOES_CINEMA_STORAGE_RESERVE_GIB',
              'ECHOES_CINEMA_DEFAULT_JOB_GIB',
              'ECHOES_CINEMA_MAX_JOB_GIB',
            ],
            "runner": ['resumable_http_render_worker.py', '"--resume"'],
            "resume_worker": [
              'REUSED_VALIDATED',
              'SHA256_AND_MEDIA_QC_VALIDATED',
              'os.replace(temp_path, path)',
            ],
            "launcher": [
              'D:\\A.I\\EchoesCinema\\jobs',
              'D:\\A.I\\EchoesCinema\\.venv-cinema\\Scripts\\python.exe',
              'cinema_job_service_durable.py',
              'Cinema job output must not use drive C:',
              'compiler-free Python',
              'job-ledger.json',
              'StorageReserveGiB',
              'DefaultJobGiB',
              'MaxJobGiB',
              'ECHOES_CINEMA_STORAGE_RESERVE_GIB',
            ],
          }
          sources = {
            "ledger": ledger,
            "scheduler": scheduler,
            "service": service,
            "runner": runner,
            "resume_worker": resume_worker,
            "launcher": launcher,
          }
          for name, tokens in required.items():
            for token in tokens:
              assert token in sources[name], f"{name} missing durable scheduler token: {token}"
          print("Durable Cinema priority, storage admission, evidence resume, restart safety, and D-drive contract PASS")
