name: Echoes Cinema Windows Control Center Smoke

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-one-click-smoke:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Windows control center stack
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/echoes-cinema-provider-worker.ps1
            scripts/echoes-cinema-stack-supervisor.ps1
            scripts/start-echoes-cinema-stack.ps1
            scripts/stop-echoes-cinema-stack.ps1
            tests/fixtures/first_real_clip_sections.csv
            tools/assemble_render.py
            tools/cinema_control_center.py
            tools/cinema_job_ledger.py
            tools/cinema_job_runner.py
            tools/cinema_job_scheduler.py
            tools/cinema_job_service.py
            tools/cinema_job_service_durable.py
            tools/http_render_worker.py
            tools/python_render_manifest.py
            tools/render_capabilities.py
            tools/render_resume.py
            tools/resumable_http_render_worker.py
          sparse-checkout-cone-mode: false

      - name: Create D-only Python environment
        shell: pwsh
        run: |
          if (-not (Test-Path "D:\")) {
            $target = Join-Path $env:RUNNER_TEMP "echoes-d"
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            subst D: $target
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "echoes-subst-created.txt") -Value "true"
          }
          python -m venv D:\A.I\EchoesCinema\.venv-cinema
          if (-not (Test-Path D:\A.I\EchoesCinema\.venv-cinema\Scripts\python.exe)) {
            throw "D-drive venv was not created"
          }

      - name: Run the real Windows one-click stack end to end
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP "echoes-stack-diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $env:RUNNER_TRACKING_ID = ""
          try {
            & .\scripts\start-echoes-cinema-stack.ps1 `
              -WorkspaceRoot "D:\A.I\EchoesCinema" `
              -RepoRoot $PWD.Path `
              -StartupTimeoutSeconds 90 `
              -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw "Windows stack launcher failed" }

            $statePath = "D:\A.I\EchoesCinema\runtime\stack-state.json"
            if (-not (Test-Path $statePath)) { throw "stack-state.json is missing" }
            $rawState = Get-Content $statePath -Raw
            $state = $rawState | ConvertFrom-Json
            $statusUrl = $state.dashboardUrl.TrimEnd([char]'/') + '/v1/control-center/status'
            Invoke-WebRequest -Uri $state.dashboardUrl -UseBasicParsing -TimeoutSec 10 -OutFile (Join-Path $diagnostics "dashboard.html")
            Invoke-WebRequest -Uri $statusUrl -UseBasicParsing -TimeoutSec 10 -OutFile (Join-Path $diagnostics "status.json")
            Copy-Item $statePath (Join-Path $diagnostics "stack-state.json") -Force
            Copy-Item "D:\A.I\EchoesCinema\logs\*" $diagnostics -Force -ErrorAction SilentlyContinue

            $dashboard = Get-Content (Join-Path $diagnostics "dashboard.html") -Raw
            $status = Get-Content (Join-Path $diagnostics "status.json") -Raw | ConvertFrom-Json
            if ($state.schema -ne "echoes.cinema-stack-state.v1") { throw "stack state schema mismatch" }
            if ($state.status -notin @("RUNNING", "PARTIAL")) { throw "stack state is not running" }
            if (-not $state.servicePid) { throw "service PID is missing" }
            if ($state.secretsPersisted -ne $false) { throw "secretsPersisted must be false" }
            if ($state.systemDriveWritesAllowed -ne $false) { throw "systemDriveWritesAllowed must be false" }
            if ($dashboard -notlike "*ECHOES CINEMA*") { throw "localhost dashboard HTML is missing" }
            if ($status.schema -ne "echoes.cinema-control-center.v1") { throw "control center schema mismatch" }
            if ($status.service.backend -ne "cinema-durable-control-center") { throw "control center backend mismatch" }
            if ($rawState -match '(?i)"(?:token|serviceToken|providerToken)"\s*:' -or $rawState -match '(?i)Bearer\s+[A-Za-z0-9._~+\-/=]{16,}') {
              throw "stack state contains a secret value"
            }
            Write-Host "Windows localhost dashboard PASS url=$($state.dashboardUrl) status=$($status.status)"
          } finally {
            if (Test-Path .\scripts\stop-echoes-cinema-stack.ps1) {
              & .\scripts\stop-echoes-cinema-stack.ps1 -WorkspaceRoot "D:\A.I\EchoesCinema" -GraceSeconds 10
            }
            if (Test-Path (Join-Path $env:RUNNER_TEMP "echoes-subst-created.txt")) {
              subst D: /d
            }
          }

      - name: Upload Windows stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoes-windows-control-center-diagnostics
          path: ${{ runner.temp }}/echoes-stack-diagnostics
          if-no-files-found: warn
          retention-days: 3
