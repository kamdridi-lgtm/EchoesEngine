name: Echoes Cinema Windows Control Center Smoke

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-one-click-smoke:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Windows control center stack
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/echoes-cinema-provider-worker.ps1
            scripts/echoes-cinema-stack-supervisor.ps1
            scripts/start-echoes-cinema-stack.ps1
            scripts/stop-echoes-cinema-stack.ps1
            tests/fixtures/first_real_clip_sections.csv
            tools/assemble_render.py
            tools/cinema_control_center.py
            tools/cinema_job_ledger.py
            tools/cinema_job_runner.py
            tools/cinema_job_scheduler.py
            tools/cinema_job_service.py
            tools/cinema_job_service_durable.py
            tools/http_render_worker.py
            tools/python_render_manifest.py
            tools/render_capabilities.py
            tools/render_resume.py
            tools/resumable_http_render_worker.py
          sparse-checkout-cone-mode: false

      - name: Create D-only Python environment
        shell: pwsh
        run: |
          if (-not (Test-Path "D:\")) {
            $target = Join-Path $env:RUNNER_TEMP "echoes-d"
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            subst D: $target
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "echoes-subst-created.txt") -Value "true"
          }
          python -m venv D:\A.I\EchoesCinema\.venv-cinema
          if (-not (Test-Path D:\A.I\EchoesCinema\.venv-cinema\Scripts\python.exe)) {
            throw "D-drive venv was not created"
          }

      - name: Start stack through the real Windows launcher logic
        shell: pwsh
        run: |
          & .\scripts\start-echoes-cinema-stack.ps1 `
            -WorkspaceRoot "D:\A.I\EchoesCinema" `
            -RepoRoot $PWD.Path `
            -StartupTimeoutSeconds 90 `
            -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "Windows stack launcher failed" }

      - name: Capture Windows stack diagnostics
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP "echoes-stack-diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          Copy-Item "D:\A.I\EchoesCinema\runtime\stack-state.json" (Join-Path $diagnostics "stack-state.json") -Force
          $state = Get-Content "D:\A.I\EchoesCinema\runtime\stack-state.json" -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $state.dashboardUrl -UseBasicParsing -TimeoutSec 10 -OutFile (Join-Path $diagnostics "dashboard.html")
          Invoke-WebRequest -Uri ($state.dashboardUrl.TrimEnd([char]'/') + '/v1/control-center/status') -UseBasicParsing -TimeoutSec 10 -OutFile (Join-Path $diagnostics "status.json")
          Copy-Item "D:\A.I\EchoesCinema\logs\*" $diagnostics -Force -ErrorAction SilentlyContinue
          Get-Content (Join-Path $diagnostics "stack-state.json")
          Get-Content (Join-Path $diagnostics "status.json")

      - name: Verify published stack state
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "echoes-stack-diagnostics"
          state = json.loads((root / "stack-state.json").read_text(encoding="utf-8-sig"))
          assert state["schema"] == "echoes.cinema-stack-state.v1"
          assert state["status"] in {"RUNNING", "PARTIAL"}
          assert state.get("dashboardUrl")
          assert isinstance(state.get("servicePid"), int) and state["servicePid"] > 0
          assert state.get("secretsPersisted") is False
          assert state.get("systemDriveWritesAllowed") is False
          print("Published Windows stack state PASS")

      - name: Verify localhost dashboard HTTP contract
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "echoes-stack-diagnostics"
          html = (root / "dashboard.html").read_text(encoding="utf-8-sig")
          status = json.loads((root / "status.json").read_text(encoding="utf-8-sig"))
          assert "ECHOES CINEMA" in html
          assert status["schema"] == "echoes.cinema-control-center.v1"
          assert status["status"] in {"PASS", "PARTIAL"}
          assert status["service"]["backend"] == "cinema-durable-control-center"
          print("Windows localhost dashboard HTTP PASS")

      - name: Verify stack state contains no secret value
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          raw = (Path(os.environ["RUNNER_TEMP"]) / "echoes-stack-diagnostics" / "stack-state.json").read_text(encoding="utf-8-sig")
          assert not re.search(r'(?i)"(?:token|serviceToken|providerToken)"\s*:', raw)
          assert not re.search(r'(?i)Bearer\s+[A-Za-z0-9._~+\-/=]{16,}', raw)
          print("Windows stack secret persistence guard PASS")

      - name: Upload Windows stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoes-windows-control-center-diagnostics
          path: ${{ runner.temp }}/echoes-stack-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Stop stack through the real Windows stop logic
        if: always()
        shell: pwsh
        run: |
          try {
            if (Test-Path .\scripts\stop-echoes-cinema-stack.ps1) {
              & .\scripts\stop-echoes-cinema-stack.ps1 -WorkspaceRoot "D:\A.I\EchoesCinema" -GraceSeconds 10
            }
            Start-Sleep -Seconds 2
            $statePath = "D:\A.I\EchoesCinema\runtime\stack-state.json"
            if (Test-Path $statePath) {
              $state = Get-Content $statePath -Raw | ConvertFrom-Json
              Write-Host "Final stack state: $($state.status)"
            }
          } finally {
            if (Test-Path (Join-Path $env:RUNNER_TEMP "echoes-subst-created.txt")) {
              subst D: /d
            }
          }
