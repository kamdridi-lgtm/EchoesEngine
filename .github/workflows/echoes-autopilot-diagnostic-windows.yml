name: Echoes Autopilot Diagnostic Windows

on:
  pull_request:
    paths:
      - "scripts/install-echoes-autopilot.ps1"
      - "scripts/invoke-echoes-autopilot.ps1"
      - "tools/echoes_autopilot.py"
      - "config/echoes-autopilot-policy.v1.json"
      - ".github/workflows/echoes-autopilot-diagnostic-windows.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact packaged seed-folder scenario with complete output
        shell: pwsh
        continue-on-error: true
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'Echoes Autopilot Diagnostic With Spaces'
          $source = Join-Path $base 'Package Source'
          $seed = Join-Path $source 'SONGS-TO-ANALYZE'
          New-Item -ItemType Directory -Force -Path $seed | Out-Null
          foreach ($relative in @(
            'scripts/install-echoes-autopilot.ps1',
            'scripts/invoke-echoes-autopilot.ps1',
            'scripts/install-song-activity-runtime.ps1',
            'scripts/analyze-song-activity.ps1',
            'tools/echoes_autopilot.py',
            'tools/provision_silero_vad.py',
            'tools/prove_silero_vad.py',
            'tools/silero_speech_segments.py',
            'tools/song_activity_timeline.py',
            'tools/build_song_activity_timeline.py',
            'config/echoes-autopilot-policy.v1.json',
            'config/local-song-activity-runtime.v1.json',
            'config/models/silero-vad-6.2.1.json',
            'requirements/song-activity-runtime-windows.txt'
          )) {
            $destination = Join-Path $source $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath $relative -Destination $destination
          }
          $audioOne = Join-Path $seed 'Kam Dridi Diagnostic One.wav'
          $audioTwo = Join-Path $seed 'Kam Dridi Diagnostic Duplicate.wav'
          python tools/generate_local_song_activity_smoke_wav.py --output $audioOne
          Copy-Item -LiteralPath $audioOne -Destination $audioTwo
          $arguments = @(
            '-NoProfile','-ExecutionPolicy','Bypass','-File',(Join-Path $source 'scripts/install-echoes-autopilot.ps1'),
            '-SourceRoot',$source,
            '-AutopilotRoot',(Join-Path $base 'Autopilot'),
            '-RuntimeRoot',(Join-Path $base 'Runtime'),
            '-InboxRoot',(Join-Path $base 'Inbox'),
            '-ResultsRoot',(Join-Path $base 'Results'),
            '-ControlRoot',(Join-Path $base 'Control'),
            '-PythonExecutable',(Get-Command python).Source,
            '-AllowNonDDrive','-SkipPrerequisiteInstall','-SkipScheduledTask','-SkipRemotePolicy','-NoOpen'
          )
          $output = & powershell.exe @arguments 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath (Join-Path $base 'diagnostic-install.log') | Out-Host
          "exitCode=$exitCode" | Add-Content -LiteralPath (Join-Path $base 'diagnostic-install.log')
          "DIAGNOSTIC_ROOT=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Inventory diagnostic files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:DIAGNOSTIC_ROOT) {
            Get-ChildItem -LiteralPath $env:DIAGNOSTIC_ROOT -Recurse -Force |
              Select-Object FullName,Length,LastWriteTimeUtc |
              ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath (Join-Path $env:DIAGNOSTIC_ROOT 'diagnostic-inventory.json') -Encoding utf8
          }
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoes-autopilot-diagnostic-windows
          path: ${{ env.DIAGNOSTIC_ROOT }}
          if-no-files-found: error
          retention-days: 14
